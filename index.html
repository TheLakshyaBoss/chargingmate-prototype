<style>
:root {
  --k: #000000;
  --w: #ffffff;
  --g50: #f8f9fa;
  --g100: #f1f2f4;
  --g200: #e5e7eb;
  --g400: #9ca3af;
  --g600: #595959;
  --ev-green: #05a357;
  --uber-blue: #276ef1;
  --shadow-sheet: 0 -8px 30px rgba(0,0,0,0.12);
  --shadow-card: 0 4px 18px rgba(0,0,0,0.06);
  --radius-xl: 20px;
  --radius-md: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: var(--k);
  background: #fcfcfc;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
  transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
}

:focus-visible {
  outline: 2px solid var(--k);
  outline-offset: 2px;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.leaflet-control-zoom {
  border: 0 !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
  border-radius: 12px !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  width: 36px !important;
  height: 36px !important;
  line-height: 36px !important;
  color: #000 !important;
}

/* Uber Header Pill */
#top {
  position: fixed;
  z-index: 500;
  top: max(16px, env(safe-area-inset-top));
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.pill-container {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--w);
  border-radius: 999px;
  padding: 8px 12px 8px 16px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(0,0,0,0.04);
}

.loc-dot {
  width: 8px;
  height: 8px;
  background: var(--k);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
}

.pill-text small {
  display: block;
  font-size: 10.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--g600);
}

.pill-text b {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

#gps {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--g100);
  display: grid;
  place-items: center;
  font-size: 16px;
  pointer-events: auto;
}
#gps:hover { background: var(--g200); }

/* Uber Sheet */
#sheet {
  position: fixed;
  z-index: 600;
  background: var(--w);
  display: flex;
  flex-direction: column;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.grab-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--g200);
  margin: 10px auto 4px;
  flex: none;
}

#view {
  overflow-y: auto;
  padding: 14px 20px 24px;
  flex: 1;
  overscroll-behavior: contain;
}

@media(max-width: 799px) {
  #sheet {
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 58vh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    box-shadow: var(--shadow-sheet);
    padding-bottom: env(safe-area-inset-bottom);
  }
}

@media(min-width: 800px) {
  #sheet {
    top: 20px;
    left: 20px;
    bottom: 20px;
    width: 410px;
    border-radius: var(--radius-xl);
    box-shadow: 0 12px 40px rgba(0,0,0,0.14);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .grab-handle { display: none; }
  #top { left: 450px; right: auto; }
}

/* Typography & Core UI */
h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--k);
}

h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.sub {

  font-size: 13.5px;
  font-weight: 400;
  margin-top: 3px;
}

.btn-primary {

  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: var(--k);
  color: var(--w);
  font-weight: 600;
  font-size: 15px;
  padding: 14px 20px;
  border-radius: var(--radius-md);
  text-decoration: none;
}
.btn-primary:hover { background: #222; }
.btn-primary:active { transform: scale(0.99); }

.btn-ghost {
  background: var(--g100);
  font-weight: 600;
  font-size: 14px;
  padding: 12px 18px;
  border-radius: var(--radius-md);
}
.btn-ghost:hover { background: var(--g200); }

/* Horizontal Category Chips */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 16px -20px 8px;
  padding: 0 20px 4px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--g100);
  font-weight: 500;
  font-size: 13px;
  color: var(--g600);
}
.chip:hover { background: var(--g200); }
.chip[aria-pressed="true"] {
  background: var(--k);
  color: var(--w);
  font-weight: 600;
}

/* Listing Rows */
.row {
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 14px 0;
  border-bottom: 1px solid var(--g100);
  transition: background 0.15s ease;
}
.row:hover {
  background: var(--g50);
  margin: 0 -20px;
  padding: 14px 20px;
  width: calc(100% + 40px);
}
.row:last-child { border-bottom: none; }

.ic {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--g100);
  display: grid;
  place-items: center;
  font-size: 18px;
}

.row .m {

  min-width: 0;
}

.row b {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row span.s {

  font-size: 12.5px;
  color: var(--g600);
  margin-top: 3px;
}

.row .r {

  flex: none;
}
.row .r b {

  font-weight: 700;
  display: block;
}

.badge-fast {

  color: #05a357;
  font-size: 11px;
  font-weight: 700;
  border-radius: 4px;
  padding: 2px 6px;

.badge-tag {

  font-weight: 600;

.back-btn {

.price-block {

#steps {

  gap: 12px;
  align-items: center;
  padding: 10px 0;

  width: 32px;

  border-radius: 50%;

  font-size: 15px;
  font-weight: 700;
}
#steps .step-tx {
  flex: 1;
  font-size: 13.5px;
  font-weight: 500;
}
#steps .step-km {
  color: var(--g600);
  font-size: 12.5px;

/* Markers */
.pw { background: none; border: 0; }
.uber-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--k);
  color: var(--w);
  border-radius: 999px;
  padding: 6px 12px;
  font-weight: 600;
  font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: transform 0.18s ease;

.uber-pin:hover { transform: translate(-50%, -50%) scale(1.06); }
.uber-pin.sel {
  background: var(--uber-blue);
  color: var(--w);
  box-shadow: 0 6px 20px rgba(39, 110, 241, 0.4);

.uber-pin .zap { color: #00ff7f; font-size: 11px; }

.me-dot {
  position: absolute;
  width: 18px;
  height: 18px;
  margin: -9px 0 0 -9px;
  border-radius: 50%;
  background: var(--uber-blue);
  border: 3px solid #fff;
  box-shadow: 0 0 0 0 rgba(39, 110, 241, 0.4);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  to { box-shadow: 0 0 0 16px rgba(39, 110, 241, 0); }
}

#toast {
  position: fixed;
  z-index: 900;
  left: 50%;
  top: 75px;
  transform: translateX(-50%);
  background: var(--k);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 500;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  display: none;
}
</style>
</head>

let selectedSociety = null;
let activeFilter = "All";
let routeLayer = L.layerGroup();
const markers = {};

const map = L.map("map", { zoomControl: false }).setView(DEFAULT_LOC, 13);
L.control.zoom({ position: "topright" }).addTo(map);

const esriBase = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}";
const esriRef = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}";

L.tileLayer(esriBase, { maxZoom: 19, maxNativeZoom: 16, attribution: "Esri, HERE" }).addTo(map);
L.tileLayer(esriRef, { maxZoom: 19, maxNativeZoom: 16 }).addTo(map);
routeLayer.addTo(map);

}).addTo(map);

// Custom Uber-styled Pin
const createPin = (item, isSelected = false) => L.divIcon({
  className: "pw",
  html: `<div class="uber-pin${isSelected ? ' sel' : ''}">
          <span class="zap">&#9889;</span>

  iconSize: [0, 0]
});

SOCIETIES.forEach(item => {
  markers[item.id] = L.marker([item.lat, item.lng], { icon: createPin(item) })

    .on("click", () => selectSociety(item.id));
});

const getResponsivePad = () => window.innerWidth >= 800 
  ? { paddingTopLeft: [440, 60], paddingBottomRight: [60, 60] }
  : { paddingTopLeft: [20, 100], paddingBottomRight: [20, Math.round(window.innerHeight * 0.58) + 20] };

/* Geodesic & Navigation Math */
const calcDistance = (coord1, coord2) => {
  const R = 6371;
  const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
  const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};

const calcBearing = (a, b) => {
  const r = Math.PI / 180;
  const dLng = (b[1] - a[1]) * r;
  const y = Math.sin(dLng) * Math.cos(b[0] * r);
  const x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos(dLng);
  return (Math.atan2(y, x) / r + 360) % 360;
};

const getDirectionName = deg => ["North", "North-East", "East", "South-East", "South", "South-West", "West", "North-West"][Math.round(deg / 45) % 8];

const estimateMetrics = item => {
  item.distKm = calcDistance(origin, [item.lat, item.lng]) * 1.35; // Urban road factor
  item.driveMins = Math.max(3, Math.round((item.distKm / 24) * 60)); // Avg 24 km/h city speed
};

const getSortedSocieties = () => {
  SOCIETIES.forEach(estimateMetrics);
  return [...SOCIETIES].sort((a, b) => a.distKm - b.distKm);
};

const showToast = msg => {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display = "none", 3200);
};

/* View: List View */
function renderList() {
  routeLayer.clearLayers();
  selectedSociety = null;
  SOCIETIES.forEach(item => markers[item.id].setIcon(createPin(item)));

  const sortedList = getSortedSocieties();
  const categories = ["All", "DC Fast", "Gated High-Rise", "Open to Visitors"];
  
  const filteredList = sortedList.filter(item => {
    if (activeFilter === "All") return true;
    if (activeFilter === "DC Fast") return item.power >= 30;
    if (activeFilter === "Gated High-Rise") return item.type.includes("High-Rise") || item.type.includes("Luxury");
    if (activeFilter === "Open to Visitors") return item.access.toLowerCase().includes("open") || item.access.toLowerCase().includes("visitor");
    return true;
  });

  view.innerHTML = `
    <h1>Residential EV Hubs</h1>
    <p class="sub">${SOCIETIES.length} verified society stations in Udaipur</p>
    
    <button class="btn-primary" id="closestBtn" style="margin-top:14px">
      <span>Route to Closest Charger</span>
      <span>&rarr;</span>
    </button>

    <div class="chips" role="tablist">
      ${categories.map(c => `
        <button class="chip" aria-pressed="${c === activeFilter}" data-cat="${c}">${c}</button>
      `).join("")}
    </div>

    <div style="margin-top: 6px;">
      ${filteredList.map((item, idx) => `
        <button class="row" data-id="${item.id}">
          <div class="ic">🏢</div>
          <div class="m">
            <b>
              ${item.name}
              ${item.id === sortedList[0].id ? '<span class="badge-tag">Closest</span>' : ''}
              ${item.power >= 30 ? '<span class="badge-fast">Fast</span>' : ''}
            </b>
            <span class="s">${item.area} &bull; ${item.free}/${item.total} Free &bull; ${item.power}kW</span>
          </div>
          <div class="r">
            <b>${item.cost}</b>
            <span class="s">${item.distKm.toFixed(1)} km</span>
          </div>
        </button>
      `).join("") || '<p class="sub" style="padding:28px 0; text-align:center;">No apartment societies found in this filter.</p>'}
    </div>
  `;

  $("closestBtn").onclick = () => selectSociety(sortedList[0].id);
  view.querySelectorAll(".chip").forEach(btn => btn.onclick = () => {
    activeFilter = btn.dataset.cat;
    renderList();
  });
  view.querySelectorAll(".row").forEach(btn => btn.onclick = () => selectSociety(+btn.dataset.id));

  if (!renderList.hasFitted) {
    map.fitBounds(L.latLngBounds([origin, ...SOCIETIES.map(s => [s.lat, s.lng])]), getResponsivePad());
    renderList.hasFitted = true;
  }
}

/* View: Detail View */
function selectSociety(id) {
  selectedSociety = SOCIETIES.find(s => s.id === id);
  estimateMetrics(selectedSociety);

  SOCIETIES.forEach(item => {
    markers[item.id].setIcon(createPin(item, item.id === id));
    markers[item.id].setZIndexOffset(item.id === id ? 1000 : 0);
  });

  const s = selectedSociety;
  const targetCoord = [s.lat, s.lng];
  const bearing = calcBearing(origin, targetCoord);
  const dirName = getDirectionName(bearing);
  const km = s.distKm.toFixed(1);
  const estChargeTime = Math.round((30 / s.power) * 60 * 1.1); // approx time for 30kWh

  view.innerHTML = `
    <button class="back-btn" id="backToListBtn">&larr; Back to all societies</button>
    
    <div class="hd">
      <div>
        <h2>${s.name}</h2>
        <p class="sub">${s.type} &bull; ${s.area}</p>
        <p class="sub" style="margin-top:4px;">★ ${s.rating} &bull; ${s.hours}</p>
      </div>
      <div class="price-block">
        <b>${s.cost}</b>
        <small>${s.access}</small>
      </div>
    </div>

    <div class="eta-card">
      <div>
        <div class="time">${s.driveMins} mins away</div>
        <div class="dist">${km} km &bull; ${dirName} of your location</div>
      </div>
      <div style="font-size:24px;">⚡</div>
    </div>

    <div class="specs-grid">
      <div class="spec-box">
        <small>Charging Speed</small>
        <b>${s.power} kW</b>
      </div>
      <div class="spec-box">
        <small>Connector Type</small>
        <b>${s.conn}</b>
      </div>
      <div class="spec-box">
        <small>Live Status</small>
        <b>${s.free} of ${s.total} bays free</b>
      </div>
      <div class="spec-box">
        <small>Est. 30 kWh Top-Up</small>
        <b>~${estChargeTime} min</b>
      </div>
    </div>

    <p class="about-text">${s.about}</p>

    <div class="tags-row">
      ${s.tags.map(t => `<span>${t}</span>`).join("")}
    </div>

    <ol id="steps" hidden>
      <li>
        <span class="step-ic"><span style="transform:rotate(${Math.round(bearing)}deg); display:inline-block;">&uarr;</span></span>
        <span class="step-tx">Drive ${dirName} along main connector</span>
        <span class="step-km">${km} km</span>
      </li>
      <li>
        <span class="step-ic">🏢</span>
        <span class="step-tx">Check-in at ${s.name} security barrier & proceed to charging bay</span>
        <span class="step-km">Arrival</span>
      </li>
    </ol>

    <div class="actions-sticky">
      <a class="btn-primary" target="_blank" rel="noopener" 
         href="https://www.google.com/maps/dir/?api=1&origin=${origin[0]},${origin[1]}&destination=${s.lat},${s.lng}&travelmode=driving">
        Open Directions
      </a>
      <button class="btn-ghost" id="toggleRouteBtn">Steps</button>
    </div>
  `;

  $("backToListBtn").onclick = renderList;
  $("toggleRouteBtn").onclick = () => {
    const stepsEl = $("steps");
    stepsEl.hidden = !stepsEl.hidden;
    $("toggleRouteBtn").textContent = stepsEl.hidden ? "Steps" : "Hide";
    if (!stepsEl.hidden) stepsEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  // Draw clean route path
  routeLayer.clearLayers();
  L.polyline([origin, targetCoord], { color: "#ffffff", weight: 8, lineCap: "round" }).addTo(routeLayer);
  L.polyline([origin, targetCoord], { color: "#000000", weight: 4, lineCap: "round" }).addTo(routeLayer);
  L.circleMarker(origin, { radius: 6, color: "#000000", weight: 3, fillColor: "#ffffff", fillOpacity: 1 }).addTo(routeLayer);

  map.fitBounds(L.latLngBounds([origin, targetCoord]), getResponsivePad());
}

/* Geolocation Hook */
$("gps").onclick = () => {
  if (!navigator.geolocation) return showToast("Location service unavailable.");
  
  navigator.geolocation.getCurrentPosition(
    pos => {
      const userCoord = [pos.coords.latitude, pos.coords.longitude];
      if (calcDistance(userCoord, DEFAULT_LOC) > 45) {
        return showToast("Demo configured for Udaipur city perimeter.");
      }
      origin = userCoord;
      $("loc").textContent = "Near Your Location";
      userMarker.setLatLng(userCoord);
      renderList.hasFitted = false;
      renderList();
      showToast("Updated location");
    },
    () => showToast("Please permit GPS access."),
    { enableHighAccuracy: true, timeout: 8000 }
  );
};

// Initialize
renderList();
</script>
</body>
</html>
