<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChargingMate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--k:#000;--w:#fff;--g1:#f3f3f3;--g2:#e2e2e2;--g3:#6b6b6b;--ev:#05a357;--bl:#276ef1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font:400 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--k);background:var(--g1)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
#map{position:fixed;inset:0}
.leaflet-container{font-family:inherit}
.leaflet-control-zoom{border:0!important;box-shadow:0 2px 10px #0003!important}
.leaflet-control-attribution{font-size:10px}

/* top location pill */
#top{position:fixed;z-index:500;top:max(12px,env(safe-area-inset-top));left:12px;right:60px;display:flex;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--w);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 4px 16px #0003;max-width:100%}
.pill .sq{width:8px;height:8px;background:var(--k);flex:none}
.pill small{display:block;font-size:11px;color:var(--g3);line-height:1.1}
.pill b{font-weight:600;white-space:nowrap}
#gps{width:36px;height:36px;border-radius:50%;background:var(--g1);font-size:18px;display:grid;place-items:center}
#gps:hover{background:var(--g2)}

/* sheet */
#sheet{position:fixed;z-index:600;background:var(--w);display:flex;flex-direction:column;box-shadow:0 -4px 24px #0003}
.grab{width:40px;height:4px;border-radius:2px;background:var(--g2);margin:8px auto 0;flex:none}
#view{overflow:auto;padding:12px 16px 0;flex:1;overscroll-behavior:contain}
@media(max-width:799px){#sheet{left:0;right:0;bottom:0;max-height:52vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}}
@media(min-width:800px){#sheet{top:16px;left:16px;bottom:16px;width:392px;border-radius:16px;box-shadow:0 8px 32px #0003}.grab{display:none}#view{padding-top:20px}#top{left:424px}}

h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--g3);font-size:14px;margin-top:2px}
.primary{display:block;width:100%;background:var(--k);color:var(--w);font-weight:600;padding:14px;border-radius:10px;text-align:center}
.primary:hover{background:#222}
.ghost{background:var(--g1);font-weight:600;padding:14px 18px;border-radius:10px}
.ghost:hover{background:var(--g2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--g1);font-weight:500;font-size:13px}
.chip[aria-pressed=true]{background:var(--k);color:var(--w)}

/* rows */
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--g1)}
.row:hover{background:var(--g1);margin:0 -16px;padding:12px 16px;width:calc(100% + 32px)}
.ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:20px}
.row .m{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span.s{font-size:13px;color:var(--g3)}
.row .r{text-align:right;flex:none}
.row .r b{font-size:15px}
.tag{display:inline-block;background:var(--ev);color:#fff;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* detail */
.back{font-weight:600;color:var(--g3);padding:2px 0 10px}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.price{text-align:right;flex:none}
.price b{font-size:22px;display:block;line-height:1.1}
.price small{color:var(--g3);font-size:12px}
.eta{display:flex;align-items:center;gap:10px;margin:14px 0;padding:12px 14px;background:var(--g1);border-radius:12px;font-weight:600}
.eta i{font-style:normal;color:var(--g3);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{border:1px solid var(--g2);border-radius:12px;padding:10px 12px}
.grid small{display:block;color:var(--g3);font-size:12px}
.grid b{font-weight:600}
.about{margin:14px 0 10px;color:#333}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--g1);border-radius:6px;padding:4px 9px;font-size:13px}
.acts{position:sticky;bottom:0;background:var(--w);display:flex;gap:10px;padding:14px 0 16px}
.acts .primary{flex:1}
#steps{list-style:none;padding:0 0 16px}
#steps li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--g1)}
#steps .a{flex:none;width:34px;height:34px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:17px;font-weight:700}
#steps .t{flex:1}
#steps .d{color:var(--g3);font-size:13px;flex:none}

a.primary{text-decoration:none}
#steps .a span{display:inline-block}

/* markers */
.pw{background:none;border:0}
.pm{position:absolute;transform:translate(-50%,-50%);background:var(--w);border-radius:999px;padding:5px 10px;font-weight:700;font-size:12px;box-shadow:0 2px 8px #0004;white-space:nowrap}
.pm::before{content:"\26A1";color:var(--ev);margin-right:3px}
.pm.sel{background:var(--k);color:var(--w)}
.me{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--bl);border:3px solid #fff;box-shadow:0 0 0 0 #276ef188;animation:p 2s infinite}
@keyframes p{to{box-shadow:0 0 0 18px #276ef100}}
@media(prefers-reduced-motion:reduce){.me{animation:none}}
#toast{position:fixed;z-index:800;left:50%;top:80px;transform:translateX(-50%);background:var(--k);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;display:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="top"><div class="pill"><span class="sq"></span><div><small>Charging near</small><b id="loc">Udaipur 313001</b></div><button id="gps" aria-label="Use my current location">&#8982;</button></div></div>
<section id="sheet" aria-label="Chargers"><div class="grab"></div><div id="view"></div></section>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- Sample data (prototype): details, prices and availability are made up; coordinates approximate ---------- */
const C = [
  {id:1,n:"Ambrai Restaurant",t:"Fine dining",a:"Amet Haveli, Lake Pichola",lat:24.5776,lng:73.6807,p:1150,kw:60,cn:"CCS2",h:"12 PM to 11 PM",f:2,tot:4,r:4.6,am:["Lake view","Valet","Wi-Fi"],b:"Lakeside Mughlai and Rajasthani dining facing the City Palace. Charge while you enjoy the sunset."},
  {id:2,n:"Upre by 1559 AD",t:"Rooftop dining",a:"Lal Ghat, Lake Pichola",lat:24.5798,lng:73.6812,p:1200,kw:50,cn:"CCS2",h:"11 AM to 11:30 PM",f:1,tot:2,r:4.5,am:["Rooftop","Live music","Wi-Fi"],b:"Candlelit rooftop with some of the best lake views in the city."},
  {id:3,n:"Jheel's Ginger Coffee Bar",t:"Cafe",a:"Gangaur Ghat Road",lat:24.5792,lng:73.6828,p:900,kw:22,cn:"Type 2",h:"8 AM to 10 PM",f:2,tot:2,r:4.4,am:["Coffee","Bakery","Wi-Fi"],b:"Relaxed cafe with fresh coffee and sandwiches. Good for a quick top-up."},
  {id:4,n:"Natraj Dining Hall",t:"Rajasthani thali",a:"Bapu Bazaar",lat:24.5788,lng:73.6911,p:950,kw:30,cn:"Type 2",h:"10:30 AM to 10 PM",f:3,tot:3,r:4.3,am:["Veg thali","Family seating","Parking"],b:"Famous unlimited vegetarian thali near Jagdish Chowk."},
  {id:5,n:"Savage Garden",t:"Continental",a:"Chandpole",lat:24.5806,lng:73.6862,p:1100,kw:50,cn:"CCS2",h:"12 PM to 11 PM",f:1,tot:2,r:4.4,am:["Garden seating","Bar","Wi-Fi"],b:"Mediterranean and Indian menu in a leafy courtyard."},
  {id:6,n:"Cafe Edelweiss",t:"Bakery and cafe",a:"Gangaur Ghat Road",lat:24.5786,lng:73.6838,p:920,kw:22,cn:"Type 2",h:"8 AM to 10 PM",f:2,tot:2,r:4.3,am:["Bakery","Takeaway","Wi-Fi"],b:"Popular German-style bakery with pastries, sandwiches and coffee."},
  {id:7,n:"Jag Mandir Palace Restaurant",t:"Heritage dining",a:"Jag Mandir, Lake Pichola",lat:24.5712,lng:73.6801,p:1200,kw:60,cn:"CCS2",h:"12 PM to 10:30 PM",f:1,tot:2,r:4.7,am:["Island palace","Boat transfer","Valet"],b:"Dine in a palace on an island in the lake. Boat from City Palace jetty."},
  {id:8,n:"Durbar Hall, Fateh Prakash",t:"Palace dining",a:"City Palace Complex",lat:24.5758,lng:73.6831,p:1180,kw:60,cn:"CCS2",h:"7 AM to 11 PM",f:3,tot:4,r:4.6,am:["Royal decor","Valet","Concierge"],b:"Grand royal setting inside the City Palace with Rajasthani set menus."},
  {id:9,n:"Udai Kothi Rooftop",t:"Rooftop dining",a:"Hanuman Ghat",lat:24.5800,lng:73.6849,p:1080,kw:50,cn:"CCS2",h:"12 PM to 11 PM",f:2,tot:3,r:4.4,am:["Pool view","Rooftop","Bar"],b:"Rooftop restaurant with a pool and open views of the old city."},
  {id:10,n:"Fateh Sagar Lakeside Cafe",t:"Lakeside cafe",a:"Fateh Sagar Pal",lat:24.6001,lng:73.6790,p:960,kw:30,cn:"Type 2",h:"9 AM to 11 PM",f:4,tot:4,r:4.2,am:["Lake view","Snacks","Parking"],b:"Casual snack and chai stop on the Fateh Sagar promenade."},
  {id:11,n:"Celebration Residency",t:"Apartment Society",a:"Bhuwana, Sukher Road",lat:24.6225,lng:73.7052,p:750,kw:11,cn:"Type 2",h:"24 Hours",f:2,tot:3,r:4.2,am:["Gated security","Visitor parking","EV charging bay"],b:"Modern residential apartment complex near Celebration Mall with round-the-clock gated access."},
  {id:12,n:"Shubhashish Geeta Enclave",t:"Gated Society",a:"Shobhagpura",lat:24.6142,lng:73.7088,p:800,kw:22,cn:"Type 2",h:"6 AM to 11 PM",f:1,tot:2,r:4.4,am:["Security","Covered parking","Clubhouse"],b:"Well-maintained residential society with dedicated visitor parking and charging provisions."},
  {id:13,n:"Miraj Meridian Apartments",t:"Apartment Complex",a:"New Bhupalpura",lat:24.5991,lng:73.7145,p:700,kw:7.4,cn:"Type 2",h:"24 Hours",f:3,tot:4,r:4.3,am:["24/7 Security","CCTV","Basement parking"],b:"Centrally located multi-storey residential complex with reserved resident and guest charging bays."},
  {id:14,n:"Royal Palms Society",t:"Housing Society",a:"Hiran Magri, Sector 4",lat:24.5624,lng:73.7121,p:720,kw:11,cn:"Type 2",h:"24 Hours",f:2,tot:2,r:4.1,am:["Security guard","Power backup","Car parking"],b:"Established residential colony society featuring standard slow AC charging points for residents."}
];
const D0=[24.5854,73.6975],$=id=>document.getElementById(id),view=$("view");
let origin=[...D0],sel=null,flt="All",rl=L.layerGroup();
const mk={},rs=n=>"\u20B9"+n.toLocaleString("en-IN");

/* ---------- Map ---------- */
const map=L.map("map",{zoomControl:false}).setView(D0,14);
L.control.zoom({position:"topright"}).addTo(map);
const esri="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(esri+"World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16,attribution:"Tiles &copy; Esri"}).addTo(map);
L.tileLayer(esri+"World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16}).addTo(map);
rl.addTo(map);
const me=L.marker(D0,{icon:L.divIcon({className:"pw",html:'<div class="me"></div>',iconSize:[0,0]}),zIndexOffset:900}).addTo(map);
const pin=(c,s)=>L.divIcon({className:"pw",html:`<div class="pm${s?" sel":""}">${c.p}</div>`,iconSize:[0,0]});
C.forEach(c=>{mk[c.id]=L.marker([c.lat,c.lng],{icon:pin(c)}).addTo(map).on("click",()=>pick(c.id))});
const pad=()=>innerWidth>=800?{paddingTopLeft:[430,90],paddingBottomRight:[50,50]}:{paddingTopLeft:[30,110],paddingBottomRight:[30,Math.round(innerHeight*.52)+20]};

/* ---------- Helpers ---------- */
const hv=(a,b)=>{const r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const fm=m=>m<1000?Math.max(10,Math.round(m/10)*10)+" m":(m/1000).toFixed(1)+" km";
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3500)};
const icon=t=>/cafe|Cafe|Bakery/.test(t)?"\u2615":/thali/.test(t)?"\uD83C\uDF5B":/Palace|Heritage/.test(t)?"\uD83C\uDFF0":/Rooftop/.test(t)?"\uD83C\uDF06":"\uD83C\uDF7D\uFE0F";
const brg=(a,b)=>{const r=Math.PI/180,dg=(b[1]-a[1])*r,y=Math.sin(dg)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos(dg);return(Math.atan2(y,x)/r+360)%360};
const dn=d=>["north","north-east","east","south-east","south","south-west","west","north-west"][Math.round(d/45)%8];
const est=c=>{c.d=hv(origin,[c.lat,c.lng])*1.3;c.e=Math.max(2,Math.round(c.d/22*60))};
const sorted=()=>{C.forEach(est);return[...C].sort((a,b)=>a.d-b.d)};

/* ---------- List view ---------- */
function list(){
 rl.clearLayers();sel=null;
 C.forEach(c=>mk[c.id].setIcon(pin(c)));
 const all=sorted(),types=["All",...new Set(C.map(c=>c.t))],rows=all.filter(c=>flt==="All"||c.t===flt);
 view.innerHTML=`<h1>Chargers near you</h1><p class="sub">${C.length} restaurants with EV charging around Udaipur</p>
 <button class="primary" id="cl" style="margin-top:14px">Route to closest charger</button>
 <div class="chips">${types.map(t=>`<button class="chip" aria-pressed="${t===flt}" data-t="${t}">${t}</button>`).join("")}</div>
 ${rows.map(c=>`<button class="row" data-id="${c.id}"><span class="ic">${icon(c.t)}</span><span class="m"><b>${c.n}${c.id===all[0].id?'<span class="tag">Closest</span>':""}</b><span class="s">${c.t}, ${c.e} min away, ${c.f}/${c.tot} free</span></span><span class="r"><b>${rs(c.p)}</b><span class="s">${c.d.toFixed(1)} km</span></span></button>`).join("")||'<p class="sub" style="padding:20px 0">No chargers match this filter.</p>'}`;
 $("cl").onclick=()=>pick(all[0].id);
 view.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{flt=b.dataset.t;list()});
 view.querySelectorAll(".row").forEach(b=>b.onclick=()=>pick(+b.dataset.id));
 if(!rs.fit){map.fitBounds(L.latLngBounds([origin,...C.map(c=>[c.lat,c.lng])]),pad());rs.fit=1}
}

/* ---------- Detail + path (straight line, no routing service) ---------- */
function pick(id){
 sel=C.find(c=>c.id===id);est(sel);
 C.forEach(c=>{mk[c.id].setIcon(pin(c,c.id===id));mk[c.id].setZIndexOffset(c.id===id?1000:0)});
 const c=sel,to=[c.lat,c.lng],b=brg(origin,to),km=c.d.toFixed(1);
 view.innerHTML=`<button class="back" id="bk">&#8249; All chargers</button>
 <div class="hd"><div><h2>${c.n}</h2><p class="sub">${c.t}, ${c.a}</p><p class="sub">&#9733; ${c.r} &nbsp;Open ${c.h}</p></div><div class="price"><b>${rs(c.p)}</b><small>per charge</small></div></div>
 <div class="eta"><span style="font-size:20px">${c.e} min</span><i>about ${km} km, ${dn(b)} of you</i></div>
 <div class="grid"><div><small>Power</small><b>${c.kw} kW fast charge</b></div><div><small>Connector</small><b>${c.cn}</b></div><div><small>Availability</small><b>${c.f} of ${c.tot} free</b></div><div><small>Charging time</small><b>~${Math.round(30*60/c.kw*1.1)} min for 30 kWh</b></div></div>
 <p class="about">${c.b}</p><div class="tags">${c.am.map(a=>`<span>${a}</span>`).join("")}</div>
 <ol id="steps" hidden>
  <li><span class="a"><span style="transform:rotate(${Math.round(b)}deg)">&#8593;</span></span><span class="t">Head ${dn(b)} from your location</span><span class="d">${km} km</span></li>
  <li><span class="a">&#9873;</span><span class="t">Arrive at ${c.n}, ${c.a}</span><span class="d"></span></li>
 </ol>
 <div class="acts"><a class="primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${origin[0]},${origin[1]}&destination=${c.lat},${c.lng}&travelmode=driving">Open in Google Maps</a><button class="ghost" id="dr">Directions</button></div>`;
 $("bk").onclick=list;
 $("dr").onclick=()=>{const s=$("steps");s.hidden=!s.hidden;$("dr").textContent=s.hidden?"Directions":"Hide directions";if(!s.hidden)s.scrollIntoView({behavior:"smooth",block:"nearest"})};
 rl.clearLayers();
 L.polyline([origin,to],{color:"#fff",weight:10,lineCap:"round"}).addTo(rl);
 L.polyline([origin,to],{color:"#000",weight:5,lineCap:"round"}).addTo(rl);
 L.circleMarker(origin,{radius:7,color:"#000",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(rl);
 map.fitBounds(L.latLngBounds([origin,to]),pad());
}

/* ---------- Location ---------- */
$("gps").onclick=()=>{
 if(!navigator.geolocation)return toast("Location is not available in this browser.");
 navigator.geolocation.getCurrentPosition(p=>{
  const n=[p.coords.latitude,p.coords.longitude];
  if(hv(n,D0)>40)return toast("You are outside Udaipur, so the demo stays at Udaipur 313001.");
  origin=n;$("loc").textContent="Current location";me.setLatLng(n);rs.fit=0;list();
 },()=>toast("Allow location access to use your current position."),{enableHighAccuracy:true,timeout:8000});
};
list();
</script>
</body>
</html>
